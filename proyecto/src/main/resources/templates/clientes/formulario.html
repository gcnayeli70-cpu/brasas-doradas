<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Cliente</title>
    <th:block th:replace="~{fragments/head :: bootstrap-css}"></th:block>
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container">
    <h2 th:text="${cliente.idCliente} != null ? 'Editar cliente' : 'Nuevo cliente'"></h2>

    <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post" class="card p-4 shadow-sm bg-white">
        <input type="hidden" th:field="*{idCliente}">

        <div class="mb-3">
            <label class="form-label">Nombres</label>
            <input type="text" th:field="*{nombres}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Apellidos</label>
            <input type="text" th:field="*{apellidos}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">DNI</label>
            <input type="text" th:field="*{dni}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text" th:field="*{telefono}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" th:field="*{correo}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Dirección</label>
            <input type="text" th:field="*{direccion}" class="form-control">
        </div>

        <button type="submit" class="btn btn-danger">Guardar</button>
        <a href="/clientes" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
