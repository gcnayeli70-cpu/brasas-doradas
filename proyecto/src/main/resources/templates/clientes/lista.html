<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Brasas Doradas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Clientes</h2>
        <a href="/clientes/nuevo" class="btn btn-danger">+ Nuevo cliente</a>
    </div>

    <table class="table table-striped bg-white shadow-sm">
        <thead class="table-dark">
        <tr><th>ID</th><th>Nombres</th><th>Apellidos</th><th>DNI</th><th>Teléfono</th><th>Correo</th><th>Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clientes}">
            <td th:text="${c.idCliente}"></td>
            <td th:text="${c.nombres}"></td>
            <td th:text="${c.apellidos}"></td>
            <td th:text="${c.dni}"></td>
            <td th:text="${c.telefono}"></td>
            <td th:text="${c.correo}"></td>
            <td>
                <a th:href="@{/clientes/editar/{id}(id=${c.idCliente})}" class="btn btn-sm btn-outline-primary">Editar</a>
                <a th:href="@{/clientes/eliminar/{id}(id=${c.idCliente})}" class="btn btn-sm btn-outline-danger"
                   onclick="return confirm('¿Eliminar este cliente?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
