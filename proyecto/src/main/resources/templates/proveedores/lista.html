<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Proveedores - Brasas Doradas</title>
    <th:block th:replace="~{fragments/head :: bootstrap-css}"></th:block>
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Proveedores</h2>
        <a href="/proveedores/nuevo" class="btn btn-danger">+ Nuevo proveedor</a>
    </div>

    <table class="table table-striped bg-white shadow-sm">
        <thead class="table-dark">
        <tr><th>ID</th><th>Razón Social</th><th>RUC</th><th>Teléfono</th><th>Dirección</th><th>Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${proveedores}">
            <td th:text="${p.idProveedor}"></td>
            <td th:text="${p.razonSocial}"></td>
            <td th:text="${p.ruc}"></td>
            <td th:text="${p.telefono}"></td>
            <td th:text="${p.direccion}"></td>
            <td>
                <a th:href="@{/proveedores/eliminar/{id}(id=${p.idProveedor})}" class="btn btn-sm btn-outline-danger"
                   onclick="return confirm('¿Eliminar este proveedor?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
