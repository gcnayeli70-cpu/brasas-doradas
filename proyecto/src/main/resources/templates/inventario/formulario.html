<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Movimiento de Inventario</title>
    <th:block th:replace="~{fragments/head :: bootstrap-css}"></th:block>
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container">
    <h2>Nuevo movimiento de inventario</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/inventario/registrar}" method="post" class="card p-4 shadow-sm bg-white">
        <div class="mb-3">
            <label class="form-label">Producto</label>
            <select name="idProducto" class="form-select" required>
                <option th:each="p : ${productos}" th:value="${p.idProducto}" th:text="${p.nombreProducto} + ' (stock: ' + ${p.stock} + ')'"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Tipo de movimiento</label>
            <select name="tipoMovimiento" class="form-select" required>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Cantidad</label>
            <input type="number" name="cantidad" class="form-control" min="1" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Proveedor (opcional, solo para ingresos)</label>
            <select name="idProveedor" class="form-select">
                <option value="">-- Sin proveedor --</option>
                <option th:each="pr : ${proveedores}" th:value="${pr.idProveedor}" th:text="${pr.razonSocial}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Observación</label>
            <input type="text" name="observacion" class="form-control">
        </div>
        <button type="submit" class="btn btn-danger">Registrar</button>
        <a href="/inventario" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
