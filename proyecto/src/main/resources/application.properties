# ============================================================
# CONFIGURACION DE CONEXION A MYSQL
# Los valores por defecto sirven para desarrollo local con MySQL Workbench.
# Docker Compose sobreescribe estas variables de entorno automaticamente
# (ver docker-compose.yml), por lo que el mismo jar funciona en ambos casos
# sin recompilar.
# ============================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:brasas_doradas_db}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
# update: no borra tus tablas, solo ajusta si falta algo.
# Como ya creaste el script SQL manualmente, se recomienda "validate" o "none".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Ejecuta data.sql DESPUES de que Hibernate cree/actualice las tablas,
# y solo inserta si las tablas estan vacias (INSERT IGNORE en data.sql
# hace esto seguro de re-ejecutar en cada arranque del contenedor).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ============================================================
# Servidor
# ============================================================
server.port=8080

# ============================================================
# Seguridad de cookies
# ============================================================
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true

# ============================================================
# Thymeleaf
# ============================================================
spring.thymeleaf.cache=false