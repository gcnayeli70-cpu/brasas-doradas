# ==================================================================
# Pipeline CI/CD - Sistema de Gestion de Ventas "Brasas Doradas"
# Ubicacion en el repositorio: .github/workflows/ci-cd.yml
# ==================================================================
name: CI-CD Brasas Doradas

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 6 * * *'        # 06:00 UTC = 01:00 hora de Lima (regresion nocturna)
  workflow_dispatch:            # ejecucion manual desde la pestana Actions

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write
  packages: write

env:
  JAVA_VERSION: '17'
  SUITE_REGRESION: >-
    PedidoServiceTest,PedidoServiceIntegrationTest,PagoServiceTest,ProductoServiceTest,MovimientoInventarioServiceTest,EmpleadoDetailsServiceTest,PagoControllerTest,InventarioControllerTest

# El proyecto Maven esta en la subcarpeta "proyecto" del repositorio
defaults:
  run:
    working-directory: proyecto

jobs:
  build:
    name: 1-2. Checkout y construccion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del codigo fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar JDK 17 (Temurin) con cache de Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: proyecto/pom.xml
      - name: Compilar y empaquetar
        run: mvn -B -ntp clean package -DskipTests
      - name: Guardar artefacto (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: jar-sistema-ventas
          path: proyecto/target/sistema-ventas-1.0.0.jar
          retention-days: 7

  pruebas:
    name: 3. Pruebas automatizadas
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: brasas_doradas_db
          MYSQL_ROOT_PASSWORD: brasas_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: brasas_doradas_db
      DB_USER: root
      DB_PASSWORD: brasas_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: proyecto/pom.xml
      - name: Ejecutar la suite completa de pruebas y generar cobertura (JaCoCo)
        run: mvn -B -ntp verify
      - name: Publicar resultados de JUnit
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Resultados JUnit - suite completa
          path: proyecto/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: true
      - name: Guardar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            proyecto/target/surefire-reports/
            proyecto/target/site/jacoco/
          retention-days: 7
      - name: Guardar compilacion con cobertura para el analisis estatico
        uses: actions/upload-artifact@v4
        with:
          name: build-con-cobertura
          path: proyecto/target/
          retention-days: 1

  analisis-estatico:
    name: 4. Analisis estatico (SonarQube)
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: proyecto/pom.xml
      - name: Recuperar clases compiladas y reporte JaCoCo
        uses: actions/download-artifact@v4
        with:
          name: build-con-cobertura
          path: proyecto/target/
      - name: Analisis SonarQube y espera del Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: >
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=brasas-doradas-sistema-ventas
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectName="Sistema de Ventas - Brasas Doradas"
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.qualitygate.wait=true

  regresion:
    name: Suite de regresion
    needs: build
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: brasas_doradas_db
          MYSQL_ROOT_PASSWORD: brasas_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: brasas_doradas_db
      DB_USER: root
      DB_PASSWORD: brasas_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: proyecto/pom.xml
      - name: Ejecutar suite de regresion
        run: mvn -B -ntp test -Dtest="${SUITE_REGRESION}" -Dsurefire.failIfNoSpecifiedTests=false
      - name: Publicar resultados de la regresion
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Resultados JUnit - suite de regresion
          path: proyecto/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: true

  despliegue:
    name: 5. Despliegue y validacion
    needs: [ pruebas, analisis-estatico ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pruebas
    env:
      COMPOSE_PROJECT_NAME: brasas
    steps:
      - uses: actions/checkout@v4
      - name: Levantar entorno de pruebas (aplicacion + MySQL) con Docker Compose
        run: docker compose up -d --build
      - name: Prueba de humo (la pantalla de login debe responder HTTP 200)
        run: |
          for intento in $(seq 1 30); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/login || true)
            if [ "$codigo" = "200" ]; then
              echo "Aplicacion disponible (HTTP 200) en el intento $intento"
              exit 0
            fi
            sleep 5
          done
          echo "La aplicacion no respondio en 150 segundos"
          docker compose logs app
          exit 1
      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagen validada
        run: |
          IMAGEN="ghcr.io/${GITHUB_REPOSITORY,,}/sistema-ventas"
          docker tag brasas-app "$IMAGEN:${GITHUB_SHA::7}"
          docker tag brasas-app "$IMAGEN:${GITHUB_REF_NAME}"
          docker push "$IMAGEN:${GITHUB_SHA::7}"
          docker push "$IMAGEN:${GITHUB_REF_NAME}"
      - name: Detener entorno
        if: always()
        run: docker compose down -v

  notificar-fallo:
    name: Notificar fallo
    needs: [ build, pruebas, analisis-estatico, regresion, despliegue ]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Crear incidencia "defecto-pipeline"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create defecto-pipeline --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "Fallo detectado por el pipeline CI/CD" --force
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Pipeline fallido en ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" \
            --label defecto-pipeline \
            --body "El workflow fallo en la rama ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}). Ejecucion: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"